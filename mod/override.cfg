; Melvor Idle 2 Chinese patch -- GDScript build.
;
; Godot reads override.cfg from the folder holding the executable and applies it on top
; of the project settings baked into the game. Declaring an autoload here is the whole
; install: no game file is modified and nothing is injected into the game assembly.
;
; This is the ONLY file that has to sit next to Melvor2.exe. Everything else lives in
; the mod folder beside it:
;
;   Melvor Idle 2 Demo/
;   |- Melvor2.exe
;   |- override.cfg      <- this file
;   '- mod/
;      |- zhpatch.gd
;      |- zh_CN.po
;      '- README.txt
;
; To uninstall, delete this file and the mod folder. To switch language for good, use
; the Language row in the game's Interface settings, or edit language.cfg.

[autoload]

ZhPatch="*res://mod/zhpatch.gd"
